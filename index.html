<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="violet">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100f15">
  <title>YiPop Web · 消灭星星</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: light;
      --accent-h: 268;
      --accent-s: 74%;
      --primary: hsl(var(--accent-h) var(--accent-s) 43%);
      --on-primary: #fff;
      --primary-container: hsl(var(--accent-h) 74% 91%);
      --on-primary-container: hsl(var(--accent-h) 56% 20%);
      --secondary-container: hsl(var(--accent-h) 22% 90%);
      --on-secondary-container: hsl(var(--accent-h) 26% 24%);
      --surface: #fbf9ff;
      --surface-high: #f1eef7;
      --surface-highest: #e8e4ef;
      --surface-low: #fff;
      --surface-tint: hsl(var(--accent-h) 40% 97%);
      --on-surface: #1b1920;
      --on-surface-2: #4b4751;
      --outline: #7b7682;
      --outline-soft: #cbc5d1;
      --scrim: rgba(19, 17, 24, .55);
      --shadow: 0 18px 48px rgba(40, 29, 57, .10);
      --header-bg: rgba(251, 249, 255, .84);
      --board-bg: hsl(var(--accent-h) 20% 88%);
      --board-cell: rgba(72, 62, 85, .07);
      --good: #13875d;
      --danger: #ba1a1a;
      --radius-xl: 34px;
      --radius-lg: 26px;
      --radius-md: 18px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --primary: hsl(var(--accent-h) 82% 78%);
      --on-primary: hsl(var(--accent-h) 58% 20%);
      --primary-container: hsl(var(--accent-h) 52% 31%);
      --on-primary-container: hsl(var(--accent-h) 80% 91%);
      --secondary-container: hsl(var(--accent-h) 22% 24%);
      --on-secondary-container: hsl(var(--accent-h) 40% 88%);
      --surface: #111015;
      --surface-high: #1b1920;
      --surface-highest: #29262f;
      --surface-low: #0d0c11;
      --surface-tint: hsl(var(--accent-h) 16% 13%);
      --on-surface: #ece8f0;
      --on-surface-2: #c9c3ce;
      --outline: #948e9a;
      --outline-soft: #48434e;
      --scrim: rgba(0, 0, 0, .72);
      --shadow: 0 24px 64px rgba(0, 0, 0, .32);
      --header-bg: rgba(17, 16, 21, .86);
      --board-bg: hsl(var(--accent-h) 13% 17%);
      --board-cell: rgba(255, 255, 255, .035);
      --good: #58daa4;
      --danger: #ffb4ab;
    }

    :root[data-accent="blue"] { --accent-h: 213; --accent-s: 74%; }
    :root[data-accent="cyan"] { --accent-h: 184; --accent-s: 78%; }
    :root[data-accent="green"] { --accent-h: 151; --accent-s: 72%; }
    :root[data-accent="amber"] { --accent-h: 43; --accent-s: 82%; }
    :root[data-accent="orange"] { --accent-h: 22; --accent-s: 83%; }
    :root[data-accent="pink"] { --accent-h: 333; --accent-s: 78%; }
    :root[data-accent="coral"] { --accent-h: 2; --accent-s: 76%; }

    html { min-height: 100%; background: var(--surface-low); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--on-surface);
      background:
        radial-gradient(circle at 72% 12%, hsl(var(--accent-h) 64% 62% / .10), transparent 31rem),
        radial-gradient(circle at 7% 62%, hsl(calc(var(--accent-h) + 55) 58% 55% / .055), transparent 28rem),
        var(--surface-low);
      font-family: "Nebulove", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background-color .35s var(--ease), color .35s var(--ease);
    }

    button { font: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }

    .app-header {
      position: sticky;
      z-index: 50;
      top: 0;
      height: 96px;
      border-bottom: 1px solid color-mix(in srgb, var(--outline-soft) 45%, transparent);
      background: var(--header-bg);
      backdrop-filter: blur(18px) saturate(1.25);
    }

    .header-inner {
      width: min(100% - 40px, 1280px);
      height: 100%;
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; min-width: 0; gap: 16px; }
    .brand-mark {
      width: 62px;
      height: 62px;
      position: relative;
      flex: none;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 21px;
      color: var(--on-primary-container);
      background: var(--primary-container);
      box-shadow: inset 0 0 0 1px hsl(var(--accent-h) 90% 80% / .15);
    }
    .brand-mark::before, .brand-mark::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      opacity: .22;
    }
    .brand-mark::before { width: 10px; height: 10px; left: 12px; top: 12px; }
    .brand-mark::after { width: 7px; height: 7px; right: 11px; bottom: 12px; }
    .brand-spark { width: 31px; height: 31px; fill: currentColor; filter: drop-shadow(0 2px 3px hsl(var(--accent-h) 70% 15% / .15)); }
    .brand-copy { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-name { font-size: 28px; font-weight: 850; line-height: 1; letter-spacing: -.8px; white-space: nowrap; }
    .web-badge {
      padding: 7px 13px 8px;
      border-radius: 999px;
      color: var(--on-primary-container);
      background: var(--primary-container);
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
    }

    .header-actions { display: flex; align-items: center; gap: 7px; }
    .icon-button {
      width: 50px;
      height: 50px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--on-surface-2);
      background: transparent;
      cursor: pointer;
      transition: transform .18s var(--ease), background-color .2s, color .2s;
    }
    .icon-button:hover { color: var(--on-surface); background: var(--surface-highest); }
    .icon-button:active { transform: scale(.92); }
    .icon-button.active { color: var(--on-secondary-container); background: var(--secondary-container); }
    .icon-button svg { width: 27px; height: 27px; fill: currentColor; }
    .theme-icon-sun, .theme-icon-moon { display: none; }
    :root[data-theme="dark"] .theme-icon-sun { display: block; }
    :root[data-theme="light"] .theme-icon-moon { display: block; }

    .popover-wrap { position: relative; }
    .popover {
      position: absolute;
      z-index: 90;
      right: 0;
      top: calc(100% + 14px);
      width: 340px;
      padding: 22px;
      border: 1px solid color-mix(in srgb, var(--outline-soft) 65%, transparent);
      border-radius: 28px;
      color: var(--on-surface);
      background: var(--surface-highest);
      box-shadow: var(--shadow);
      transform-origin: top right;
      animation: popoverIn .2s var(--ease);
    }
    .popover[hidden] { display: none; }
    @keyframes popoverIn { from { opacity: 0; transform: scale(.92) translateY(-8px); } }
    .popover.is-closing { animation: popoverOut .16s var(--ease) forwards; pointer-events: none; }
    @keyframes popoverOut { to { opacity: 0; transform: scale(.92) translateY(-8px); } }
    .popover-title { margin: 0 0 17px; color: var(--on-surface-2); font-size: 14px; font-weight: 800; letter-spacing: .08em; }
    .palette-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .swatch {
      aspect-ratio: 1;
      position: relative;
      border: 0;
      border-radius: 50%;
      background: var(--swatch);
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
      transition: transform .2s var(--ease), box-shadow .2s;
    }
    .swatch:hover { transform: scale(1.08); }
    .swatch[aria-checked="true"] { box-shadow: 0 0 0 4px var(--surface-highest), 0 0 0 7px var(--on-surface); }
    .swatch[aria-checked="true"]::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 9px;
      left: 50%;
      top: 46%;
      border-left: 3px solid #17131d;
      border-bottom: 3px solid #17131d;
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .menu-popover { width: 315px; padding: 12px; }
    .menu-item {
      width: 100%;
      min-height: 62px;
      padding: 0 16px;
      border: 0;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--on-surface);
      background: transparent;
      text-align: left;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      transition: background-color .18s;
    }
    .menu-item:hover { background: var(--secondary-container); }
    .menu-item svg { width: 25px; height: 25px; flex: none; fill: currentColor; color: var(--on-surface-2); }
    .menu-item.danger { color: var(--danger); }
    .menu-separator { height: 1px; margin: 7px 10px; background: var(--outline-soft); }
    .switch {
      width: 46px;
      height: 28px;
      margin-left: auto;
      padding: 3px;
      border-radius: 999px;
      background: var(--outline-soft);
      transition: background .2s;
    }
    .switch::before {
      content: "";
      display: block;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--surface-low);
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
      transition: transform .22s var(--ease), background .2s;
    }
    .switch.on { background: var(--primary); }
    .switch.on::before { transform: translateX(18px); background: var(--on-primary); }

    main { width: min(100% - 40px, 1220px); margin: 0 auto; padding: 42px 0 64px; }
    .hero { margin: 0 0 28px; }
    .title-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 13px; }
    h1 { margin: 0; font-size: clamp(39px, 5vw, 62px); line-height: 1; font-weight: 900; letter-spacing: -2.2px; }
    .difficulty-caption { color: var(--on-surface-2); font-size: clamp(16px, 2vw, 20px); font-weight: 800; }
    .hero-subtitle { max-width: 620px; margin: 13px 0 0; color: var(--on-surface-2); font-size: 16px; line-height: 1.65; }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "stats" "board" "panel";
      gap: 22px;
    }

    .stats-panel {
      grid-area: stats;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: center;
    }
    .stat-card {
      min-width: 0;
      min-height: 100px;
      padding: 17px 18px;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--on-secondary-container);
      background: var(--secondary-container);
    }
    .stat-card.primary { color: var(--on-primary-container); background: var(--primary-container); }
    /* 标签直接使用容器配对色：叠加透明度后，浅色主题的青/绿与深色主题的主卡片都会跌破 4.5:1。 */
    .stat-label { margin-bottom: 3px; font-size: 14px; font-weight: 800; letter-spacing: .08em; }
    .stat-value { max-width: 100%; font-size: clamp(28px, 4vw, 38px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
    .round-action {
      width: 68px;
      height: 68px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--on-surface-2);
      background: var(--surface-highest);
      cursor: pointer;
      transition: transform .18s var(--ease), background .2s, opacity .2s;
    }
    .round-action.primary { color: var(--on-primary-container); background: var(--primary-container); }
    .round-action:hover:not(:disabled) { transform: translateY(-2px); }
    .round-action:active:not(:disabled) { transform: scale(.92); }
    .round-action:disabled { opacity: .35; cursor: default; }
    .round-action svg { width: 30px; height: 30px; fill: currentColor; }

    .board-section { grid-area: board; min-width: 0; }
    .board-shell {
      width: 100%;
      max-width: 700px;
      aspect-ratio: 1;
      position: relative;
      margin-inline: auto;
      padding: clamp(10px, 2.2vw, 19px);
      border-radius: clamp(26px, 5vw, 40px);
      background: var(--board-bg);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--outline-soft) 45%, transparent), var(--shadow);
      transition: background .3s;
    }
    .board {
      --grid-size: 10;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(var(--grid-size), minmax(0, 1fr));
      grid-template-rows: repeat(var(--grid-size), minmax(0, 1fr));
      gap: clamp(3px, calc(13px - var(--grid-size) * .7px), 8px);
      position: relative;
      touch-action: manipulation;
      user-select: none;
    }
    .board-row { display: contents; }
    .tile, .empty-cell {
      min-width: 0;
      min-height: 0;
      aspect-ratio: 1;
      border-radius: 34%;
    }
    .empty-cell { background: var(--board-cell); }
    .tile {
      --tile: #9a63da;
      --tile-dark: #7641b8;
      position: relative;
      padding: 0;
      border: 0;
      overflow: hidden;
      color: white;
      background: linear-gradient(145deg, color-mix(in srgb, var(--tile) 92%, white), var(--tile-dark));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        inset 0 -2px 0 rgba(30,15,45,.12),
        0 3px 8px rgba(20,12,30,.13);
      cursor: pointer;
      transition: transform .16s var(--ease), filter .16s, box-shadow .16s, opacity .18s;
    }
    .tile::before {
      content: "";
      position: absolute;
      width: 46%;
      height: 46%;
      left: 27%;
      top: 27%;
      background: rgba(255,255,255,.92);
      clip-path: polygon(50% 0%, 60% 34%, 86% 14%, 67% 41%, 100% 50%, 67% 59%, 86% 86%, 60% 66%, 50% 100%, 40% 66%, 14% 86%, 33% 59%, 0 50%, 33% 41%, 14% 14%, 40% 34%);
      filter: drop-shadow(0 1px 1px rgba(30,12,50,.18));
      transition: transform .18s var(--ease), opacity .18s;
    }
    .tile::after {
      content: "";
      position: absolute;
      width: 12%;
      height: 12%;
      left: 17%;
      top: 15%;
      border-radius: 50%;
      background: rgba(255,255,255,.48);
    }
    .tile:hover, .tile.group-preview, .tile:focus-visible {
      z-index: 2;
      transform: scale(1.08);
      filter: saturate(1.12) brightness(1.08);
      box-shadow: 0 6px 14px rgba(15,8,24,.25), 0 0 0 3px color-mix(in srgb, white 74%, var(--tile));
    }
    .tile:hover::before, .tile.group-preview::before { transform: scale(1.14) rotate(8deg); }
    .tile.is-exploding {
      z-index: 5;
      pointer-events: none;
      animation: tileExplode .34s var(--ease) forwards;
    }
    .tile.is-exploding::before { animation: starCoreExplode .3s ease-out forwards; }
    .tile.is-settling:not(.is-exploding) { animation: tileSettle .28s var(--ease) both; animation-delay: var(--delay, 0ms); }
    .tile.c0 { --tile: #a968e9; --tile-dark: #7f43bf; }
    .tile.c1 { --tile: #579fe8; --tile-dark: #3579c2; }
    .tile.c2 { --tile: #2ecb9a; --tile-dark: #15916d; }
    .tile.c3 { --tile: #efc44f; --tile-dark: #c59025; }
    .tile.c4 { --tile: #f1845e; --tile-dark: #ce5d3c; }
    .tile.c5 { --tile: #ec5d8f; --tile-dark: #be3768; }
    @keyframes tileExplode {
      0% { transform: scale(1); opacity: 1; filter: brightness(1); }
      28% { transform: scale(.82) rotate(-4deg); filter: brightness(1.22) saturate(1.18); }
      60% { transform: scale(1.42) rotate(var(--blast-turn, 10deg)); opacity: 1; filter: brightness(1.7) saturate(1.3); border-radius: 48%; }
      100% { transform: scale(.06) rotate(var(--blast-turn, 18deg)); opacity: 0; filter: brightness(2); border-radius: 50%; }
    }
    @keyframes starCoreExplode {
      0% { transform: scale(1); opacity: .95; }
      65% { transform: scale(2.2) rotate(25deg); opacity: 1; }
      100% { transform: scale(3.1) rotate(45deg); opacity: 0; }
    }
    @keyframes tileSettle {
      from { opacity: .4; transform: translateY(-22%) scale(.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .board.locked .tile { pointer-events: none; }
    .board.shake { animation: boardShake .28s ease; }
    @keyframes boardShake { 25% { transform: translateX(-5px); } 55% { transform: translateX(5px); } 80% { transform: translateX(-2px); } }

    .score-preview {
      position: absolute;
      z-index: 12;
      top: clamp(16px, 3vw, 25px);
      right: clamp(16px, 3vw, 25px);
      padding: 7px 11px;
      border-radius: 999px;
      color: var(--on-primary-container);
      background: var(--primary-container);
      box-shadow: 0 5px 16px rgba(0,0,0,.16);
      font-size: 13px;
      font-weight: 800;
      pointer-events: none;
      opacity: 0;
      transform: translateY(5px) scale(.94);
      transition: opacity .18s var(--ease), transform .18s var(--ease);
    }
    .score-preview.show { opacity: 1; transform: translateY(0) scale(1); }

    .control-panel { grid-area: panel; display: grid; gap: 16px; align-content: start; }
    .panel-card {
      padding: 22px;
      border: 1px solid color-mix(in srgb, var(--outline-soft) 58%, transparent);
      border-radius: 28px;
      background: color-mix(in srgb, var(--surface-high) 88%, transparent);
    }
    .panel-heading { margin: 0 0 16px; font-size: 16px; font-weight: 900; letter-spacing: .04em; }
    .progress-row { display: flex; justify-content: space-between; gap: 10px; align-items: end; }
    .progress-number { font-size: 30px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
    .progress-note { color: var(--on-surface-2); font-size: 13px; font-weight: 700; }
    .progress-track { height: 10px; margin: 15px 0 12px; overflow: hidden; border-radius: 999px; background: var(--surface-highest); }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--primary); transition: width .5s var(--ease); }
    .mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mini-stat { padding: 13px; border-radius: 17px; background: var(--surface-highest); }
    .mini-stat span { display: block; color: var(--on-surface-2); font-size: 12px; font-weight: 700; }
    .mini-stat strong { display: block; margin-top: 3px; font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }

    .difficulty-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    .difficulty-button {
      min-width: 0;
      min-height: 50px;
      padding: 8px 6px;
      border: 1.5px solid var(--outline);
      border-radius: 16px;
      color: var(--on-surface);
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      transition: border-color .18s, background .18s, transform .18s;
    }
    .difficulty-button:hover { transform: translateY(-2px); border-color: var(--primary); }
    .difficulty-button.active { border-color: transparent; color: var(--on-secondary-container); background: var(--secondary-container); }
    .difficulty-button .check { display: none; margin-right: 4px; }
    .difficulty-button.active .check { display: inline; }
    .difficulty-detail { margin: 13px 0 0; min-height: 20px; color: var(--on-surface-2); font-size: 13px; line-height: 1.55; }

    .tip-card { display: flex; align-items: flex-start; gap: 14px; }
    .tip-icon { width: 43px; height: 43px; flex: none; display: grid; place-items: center; border-radius: 15px; color: var(--on-primary-container); background: var(--primary-container); }
    .tip-icon svg { width: 23px; height: 23px; fill: currentColor; }
    .tip-copy strong { display: block; margin: 1px 0 5px; font-size: 15px; }
    .tip-copy p { margin: 0; color: var(--on-surface-2); font-size: 13px; line-height: 1.65; }
    .kbd {
      display: inline-grid;
      min-width: 24px;
      height: 24px;
      padding: 0 5px;
      place-items: center;
      border: 1px solid var(--outline-soft);
      border-radius: 7px;
      color: var(--on-surface-2);
      background: var(--surface-highest);
      font-size: 11px;
      font-weight: 800;
      box-shadow: inset 0 -1px 0 var(--outline-soft);
    }

    .toast-region { position: fixed; z-index: 130; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); pointer-events: none; }
    .toast {
      min-width: 230px;
      max-width: min(90vw, 460px);
      padding: 15px 20px;
      border-radius: 18px;
      color: var(--on-secondary-container);
      background: var(--secondary-container);
      box-shadow: var(--shadow);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      animation: toastIn .25s var(--ease);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(18px) scale(.95); } }
    .toast.is-closing { animation: toastOut .18s var(--ease) forwards; }
    @keyframes toastOut { to { opacity: 0; transform: translateY(12px) scale(.95); } }

    .score-float {
      position: fixed;
      z-index: 120;
      pointer-events: none;
      color: white;
      font-size: 19px;
      font-weight: 950;
      text-shadow: 0 2px 8px rgba(0,0,0,.35);
      /* 居中与位移动画分别用 translate / scale 独立属性表达，否则关键帧里的
         transform 会覆盖掉内联的 translateX(-50%)，让浮字在飞行中向右偏半个宽度。 */
      translate: -50% 0;
      animation: scoreFly .8s var(--ease) forwards;
    }
    @keyframes scoreFly { to { opacity: 0; translate: -50% -64px; scale: 1.22; } }
    .particle {
      --x: 0px; --y: 0px; --rot: 0deg;
      position: fixed;
      z-index: 115;
      width: 9px;
      height: 9px;
      pointer-events: none;
      background: var(--particle-color, var(--primary));
      clip-path: polygon(50% 0, 62% 36%, 100% 50%, 62% 64%, 50% 100%, 38% 64%, 0 50%, 38% 36%);
      animation: particleFly .65s var(--ease) forwards;
    }
    @keyframes particleFly { to { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--rot)) scale(.3); } }
    .blast-ring {
      --blast-size: 42px;
      position: fixed;
      z-index: 114;
      left: 0;
      top: 0;
      width: var(--blast-size);
      height: var(--blast-size);
      border: max(2px, calc(var(--blast-size) * .055)) solid var(--particle-color, var(--primary));
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 14px color-mix(in srgb, var(--particle-color, var(--primary)) 70%, transparent);
      transform: translate(-50%, -50%) scale(.28);
      animation: blastRing .38s ease-out forwards;
    }
    @keyframes blastRing {
      55% { opacity: .9; }
      to { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
    }

    .modal-layer {
      position: fixed;
      z-index: 110;
      inset: 0;
      padding: 22px;
      display: grid;
      place-items: center;
      background: var(--scrim);
      backdrop-filter: blur(8px);
      animation: fadeIn .2s ease;
    }
    .modal-layer[hidden] { display: none; }
    @keyframes fadeIn { from { opacity: 0; } }
    .modal {
      width: min(100%, 560px);
      max-height: min(86vh, 760px);
      overflow: auto;
      padding: clamp(25px, 5vw, 38px);
      border-radius: 34px;
      color: var(--on-surface);
      background: var(--surface-highest);
      box-shadow: 0 28px 90px rgba(0,0,0,.38);
      animation: modalIn .26s var(--ease);
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(22px) scale(.95); } }
    .modal-layer.is-closing { animation: fadeOut .18s ease forwards; pointer-events: none; }
    .modal-layer.is-closing .modal { animation: modalOut .18s var(--ease) forwards; }
    @keyframes fadeOut { to { opacity: 0; } }
    @keyframes modalOut { to { opacity: 0; transform: translateY(16px) scale(.96); } }
    .modal-icon { width: 66px; height: 66px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 22px; color: var(--on-primary-container); background: var(--primary-container); }
    .modal-icon svg { width: 34px; height: 34px; fill: currentColor; }
    .modal h2 { margin: 0; text-align: center; font-size: 30px; font-weight: 950; letter-spacing: -.5px; }
    .modal-lead { margin: 10px 0 25px; color: var(--on-surface-2); text-align: center; line-height: 1.65; }
    .rule-list { display: grid; gap: 11px; margin: 0 0 25px; }
    .rule {
      padding: 15px;
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 12px;
      border-radius: 18px;
      background: var(--surface-high);
    }
    .rule-number { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; color: var(--on-primary-container); background: var(--primary-container); font-weight: 900; }
    .rule strong { display: block; margin: 1px 0 4px; }
    .rule p { margin: 0; color: var(--on-surface-2); font-size: 13px; line-height: 1.55; }
    .modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
    .filled-button, .tonal-button, .text-button {
      min-height: 50px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 850;
      transition: transform .18s var(--ease), filter .18s;
    }
    .filled-button { color: var(--on-primary); background: var(--primary); }
    .tonal-button { color: var(--on-secondary-container); background: var(--secondary-container); }
    .text-button { color: var(--primary); background: transparent; }
    .filled-button:hover, .tonal-button:hover, .text-button:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .result-score { margin: 24px 0; padding: 22px; border-radius: 24px; text-align: center; background: var(--primary-container); color: var(--on-primary-container); }
    .result-score span { display: block; font-size: 13px; font-weight: 800; opacity: .76; }
    .result-score strong { display: block; margin-top: 4px; font-size: 48px; line-height: 1; font-weight: 950; font-variant-numeric: tabular-nums; }
    .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 25px; }
    .result-item { padding: 13px 8px; border-radius: 16px; text-align: center; background: var(--surface-high); }
    .result-item span { display: block; color: var(--on-surface-2); font-size: 11px; font-weight: 700; }
    .result-item strong { display: block; margin-top: 4px; font-size: 18px; font-weight: 900; }
    .records { display: grid; gap: 10px; margin: 24px 0; }
    .record-row { padding: 15px 17px; display: flex; align-items: center; justify-content: space-between; border-radius: 17px; background: var(--surface-high); }
    .record-info { display: flex; align-items: center; gap: 12px; }
    .record-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }
    .record-row span { color: var(--on-surface-2); font-size: 13px; }
    .record-row strong { font-size: 20px; font-variant-numeric: tabular-nums; }

    @media (min-width: 980px) {
      main { padding-top: 50px; }
      .game-layout {
        grid-template-columns: minmax(540px, 700px) minmax(330px, 380px);
        grid-template-areas: "board stats" "board panel";
        align-items: start;
        justify-content: center;
        column-gap: 28px;
      }
      .stats-panel { position: sticky; top: 118px; }
      .control-panel { grid-column: 2; }
      .board-section { grid-row: 1 / span 2; }
      .hero { max-width: 700px; margin-left: max(0px, calc((100% - 1108px) / 2)); }
      .panel-card { padding: 20px; }
    }

      .brand-mark { width: 50px; height: 50px; border-radius: 17px; }
      .brand-spark { width: 26px; height: 26px; }
      .brand-name { font-size: 23px; }
      .web-badge { padding: 6px 9px; font-size: 12px; }

      .icon-button { width: 43px; height: 43px; }
      .icon-button svg { width: 24px; height: 24px; }

      .hero { margin-bottom: 23px; }

      .round-action svg { width: 26px; height: 26px; }
      .game-layout { gap: 17px; }
      .popover { position: fixed; top: 88px; right: 14px; width: min(340px, calc(100vw - 28px)); }

      .modal { border-radius: 29px; }
    }

    @media (max-width: 410px) {
      .brand-copy { gap: 7px; }

      .header-inner, main { width: min(100% - 20px, 1220px); }
      h1 { font-size: 39px; }
      .difficulty-caption { font-size: 15px; }
      .stats-panel { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 49px 49px; gap: 6px; }
      .round-action { width: 49px; height: 49px; }
      .stat-card { min-height: 80px; border-radius: 20px; }
      .stat-value { font-size: 24px; }
      .difficulty-options { grid-template-columns: repeat(2, 1fr); }
      .panel-card { padding: 18px; }
      .score-preview { padding: 6px 8px; }
    }

    @media (max-width: 280px) {
      .web-badge { display: none; }
    }

    .made-with-love {
      margin: 12px 0 0;
      color: var(--on-surface-2);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }
    .made-with-love--outside {
      margin: 4px 0 0;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .02em;
      opacity: .9;
    }
    .made-with-love a {
      color: var(--primary);
      font-weight: 800;
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--primary) 38%, transparent);
      transition: color .18s, border-color .18s, opacity .18s;
    }
    .made-with-love a:hover { color: var(--on-surface); border-bottom-color: var(--primary); opacity: .92; }

    .combo-layer {
      position: fixed;
      inset: 0;
      z-index: 135;
      display: grid;
      place-items: center;
      pointer-events: none;
      padding: 24px;
    }
    .combo-layer[hidden] { display: none; }
    .combo-bubble {
      max-width: min(92vw, 520px);
      padding: 18px 28px;
      border-radius: 24px;
      color: var(--on-primary);
      background: var(--primary);
      box-shadow: 0 18px 48px rgba(0,0,0,.28), 0 0 0 1px color-mix(in srgb, white 12%, transparent);
      font-size: clamp(20px, 5vw, 34px);
      font-weight: 950;
      letter-spacing: -.2px;
      line-height: 1.2;
      text-align: center;
      text-wrap: balance;
      transform-origin: center;
      animation: comboPop .72s var(--ease) forwards;
    }
    .combo-bubble small {
      display: block;
      margin-top: 6px;
      font-size: clamp(13px, 2.8vw, 15px);
      font-weight: 800;
      opacity: .92;
      letter-spacing: .2px;
    }
    @keyframes comboPop {
      0% { opacity: 0; transform: scale(.72) translateY(18px); filter: blur(2px); }
      18% { opacity: 1; transform: scale(1.06) translateY(0); filter: blur(0); }

      78% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(.96) translateY(-10px); }
    }

            <svg viewBox="0 0 24 24"><path d="M4 6.75a1.25 1.25 0 0 1 1.25-1.25h13.5a1.25 1.25 0 1 1 0 2.5H5.25A1.25 1.25 0 0 1 4 6.75ZM4 12a1.25 1.25 0 0 1 1.25-1.25h13.5a1.25 1.25 0 1 1 0 2.5H5.25A1.25 1.25 0 0 1 4 12Zm0 5.25A1.25 1.25 0 0 1 5.25 16h13.5a1.25 1.25 0 1 1 0 2.5H5.25A1.25 1.25 0 0 1 4 17.25Z"/></svg>

            <button class="menu-item" id="soundMenu" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm13.5 3A4.5 4.5 0 0 0 15 7.97v8.05A4.5 4.5 0 0 0 17.5 12Zm0-8.5v2.07A7 7 0 0 1 21 12a7 7 0 0 1-3.5 6.43v2.07A9 9 0 0 0 23 12a9 9 0 0 0-5.5-8.5Z"/></svg><span>游戏音效</span><span class="switch" id="soundSwitch" aria-hidden="true"></span></button>
