      const MODAL_CLOSE_MS = 180;
      let modalCloseTimer = 0;

      function openModal(html, dismissible = true) {
        // 连锁动画期间打开的浮层（如爆炸途中点开的菜单）会原样留在弹窗背后；
        // 打开弹窗时一并收起，避免遮罩下挂着过期浮层、关闭弹窗后又重新冒出来。
        closePopovers();
        // 若弹窗正处于关闭动画中，取消待执行的隐藏
        clearTimeout(modalCloseTimer);
        els.modalLayer.classList.remove('is-closing');
        if (els.modalLayer.hidden) {
          lastFocusedBeforeModal = document.activeElement;
          previousBodyOverflow = document.body.style.overflow;
        }
        els.modal.innerHTML = html;
        els.modal.dataset.dismissible = String(dismissible);
        els.modalLayer.hidden = false;
        document.body.style.overflow = 'hidden';
        ($('button', els.modal) || els.modal).focus();
        $('header').inert = true;
        $('main').inert = true;
      }

      // 先播放退出动画，动画结束后再真正隐藏并清空内容
      function closeModal() {
        if (els.modalLayer.hidden || els.modalLayer.classList.contains('is-closing')) return;
        els.modalLayer.classList.add('is-closing');
        clearTimeout(modalCloseTimer);
        modalCloseTimer = setTimeout(finishCloseModal, MODAL_CLOSE_MS);
      }

      function finishCloseModal() {
        clearTimeout(modalCloseTimer);
        els.modalLayer.classList.remove('is-closing');
        els.modalLayer.hidden = true;
        els.modal.innerHTML = '';
        $('header').inert = false;
        $('main').inert = false;
        document.body.style.overflow = previousBodyOverflow;
        const previous = lastFocusedBeforeModal;
        lastFocusedBeforeModal = null;
        if (previous?.isConnected && previous !== document.body && !previous.closest('[hidden], [inert]')) {
          previous.focus({ preventScroll: true });
        } else {
          focusActiveTile();
        }
      }

      function handleBoardKeys(e) {
        if (state.locked || state.gameOver) return;
        const tile = e.target.closest('.tile');
        if (!tile || !['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return;
        e.preventDefault();
        const deltas = { ArrowUp: [-1,0], ArrowDown: [1,0], ArrowLeft: [0,-1], ArrowRight: [0,1] };
        const [dr,dc] = deltas[e.key]; let r = Number(tile.dataset.row), c = Number(tile.dataset.col);
        for (let i = 0; i < state.board.length; i++) {
          r += dr; c += dc;
          if (r < 0 || r >= state.board.length || c < 0 || c >= state.board.length) break;
          const next = tileAt(r, c);
          if (next) { next.focus(); break; }
        }
      }

      function scoreFor(count) { return count * count * 5; }
      function cloneBoard(board) { return board.map(row => row.slice()); }
      function countRemaining() { return state.board.flat().filter(v => v !== null).length; }
      function format(value) { return String(Number(value) || 0); } // 分数不加千分位分隔符，纯数字

      function saveBest() { try { localStorage.setItem(STORAGE.best, JSON.stringify(bestScores)); } catch (_) {} }
      function saveGame() {
        try { localStorage.setItem(STORAGE.game, JSON.stringify({ difficulty: state.difficulty, board: state.board, score: state.score, moves: state.moves, gameOver: state.gameOver })); } catch (_) {}
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        clearTimeout(toastHideTimer);
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        els.toast.replaceChildren(toast);
        // 总显示时长仍为 2.2s：在最后 180ms 播放退出动画，然后移除
        toastTimer = setTimeout(() => {
          const current = els.toast.firstElementChild;
          if (!current) return;
          current.classList.add('is-closing');
          toastHideTimer = setTimeout(() => { els.toast.replaceChildren(); }, 180);
        }, 2020);
      }

      function showComboCenter(title, subtitle) {
        if (prefersReducedMotion()) return;
        const token = actionToken;
        clearTimeout(comboTimer);
        els.comboLayer.hidden = false;
        els.comboLayer.replaceChildren();
        void els.comboLayer.offsetWidth;
        const bubble = document.createElement('div');
        bubble.className = 'combo-bubble';
        bubble.textContent = title;
        if (subtitle) {
          const small = document.createElement('small');
          small.textContent = subtitle;
          bubble.appendChild(small);
        }
        els.comboLayer.appendChild(bubble);
        playTone(880, .14, 'sine', .08);
        setTimeout(() => { if (token === actionToken) playTone(1175, .13, 'triangle', .06); }, 90);
        // 与 comboPop 的 1.6s 动画对齐：停够约一秒再淡出，别再一闪而过。
        comboTimer = setTimeout(() => {
          els.comboLayer.hidden = true; els.comboLayer.replaceChildren();
        }, 1650);
      }

      function prefersReducedMotion() {
        return matchMedia('(prefers-reduced-motion: reduce)').matches;
      }

      function clearEffects() {
        stopAllTones();
        clearTimeout(comboTimer);
        els.comboLayer.hidden = true;
        els.comboLayer.replaceChildren();
        $$('.particle, .blast-ring, .score-float').forEach(el => el.remove());
      }

      function makeScoreFloat(x, y, text) {
        if (prefersReducedMotion()) return;
        const el = document.createElement('span');
        el.className = 'score-float'; el.textContent = text;
        el.setAttribute('aria-hidden', 'true');
        el.style.left = `${x}px`; el.style.top = `${y}px`;
        document.body.appendChild(el); setTimeout(() => el.remove(), 850);
      }

      function makeTileBlast(rect, colorClass, sequenceIndex) {
        if (prefersReducedMotion()) return;
        const colors = ['#ad6bed','#5aa5ee','#36d3a1','#f0c64f','#f48a63','#ee6295'];
        const idx = Number((colorClass || 'c0').replace('c','')) || 0;
        const color = colors[idx];
        const x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
        const particleSize = Math.max(4, Math.min(9, rect.width * .18));
        const spread = Math.max(18, Math.min(48, rect.width * .95));
        const total = 5;

        const ring = document.createElement('span');
        ring.className = 'blast-ring';
        ring.setAttribute('aria-hidden', 'true');
        ring.style.left = `${x}px`; ring.style.top = `${y}px`;
        ring.style.setProperty('--blast-size', `${Math.max(18, rect.width * .78)}px`);
        ring.style.setProperty('--particle-color', color);
        document.body.appendChild(ring);
        setTimeout(() => ring.remove(), 430);

        for (let i = 0; i < total; i++) {
          const p = document.createElement('span'); p.className = 'particle';
          p.setAttribute('aria-hidden', 'true');
          const angle = (Math.PI * 2 * i / total) + sequenceIndex * .47 + Math.random() * .25;
          const distance = spread * (.58 + Math.random() * .55);
          p.style.left = `${x}px`; p.style.top = `${y}px`;
          p.style.width = `${particleSize}px`; p.style.height = `${particleSize}px`;
          p.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
          p.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
          p.style.setProperty('--rot', `${Math.random() * 300 - 150}deg`);
          p.style.setProperty('--particle-color', color);
          document.body.appendChild(p); setTimeout(() => p.remove(), 700);
        }
      }

      function celebrate() {
        if (prefersReducedMotion()) return;
        const colors = ['#ad6bed','#5aa5ee','#36d3a1','#f0c64f','#f48a63','#ee6295'];
        for (let i = 0; i < 46; i++) {
          const p = document.createElement('span'); p.className = 'particle';
          p.setAttribute('aria-hidden', 'true');
          p.style.left = `${10 + Math.random() * 80}vw`; p.style.top = `${15 + Math.random() * 30}vh`;
          p.style.setProperty('--x', `${Math.random() * 180 - 90}px`);
          p.style.setProperty('--y', `${120 + Math.random() * 220}px`);
          p.style.setProperty('--rot', `${Math.random() * 720 - 360}deg`);
          p.style.setProperty('--particle-color', colors[i % colors.length]);
          p.style.animationDuration = `${.8 + Math.random() * .7}s`;
          document.body.appendChild(p); setTimeout(() => p.remove(), 1600);
        }
      }

      function ensureAudio() {
        if (audioContext?.state === 'closed') {
          stopAllTones();
          audioContext = null; audioMaster = null; audioLimiter = null; audioPrimed = false;
        }
        if (!audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          try { audioContext = new AudioCtx({ latencyHint: 'interactive' }); }
          catch (_) { try { audioContext = new AudioCtx(); } catch (_) { return null; } }
          audioMaster = audioContext.createGain();
          audioMaster.gain.value = 1;
          // 限制器：音量加大后多个音效叠加时防止爆音削波
          audioLimiter = audioContext.createDynamicsCompressor();
          audioLimiter.threshold.value = -10;
          audioLimiter.knee.value = 8;
          audioLimiter.ratio.value = 6;
          audioLimiter.attack.value = .003;
          audioLimiter.release.value = .18;
          audioMaster.connect(audioLimiter);
          audioLimiter.connect(audioContext.destination);
        }
        return audioContext;
      }

      function unlockAudio() {
        if (!state.sound) return Promise.resolve(null);
        const ctx = ensureAudio();
        if (!ctx) return Promise.resolve(null);
        let ready;
        try { ready = ctx.state === 'running' ? Promise.resolve() : ctx.resume(); }
        catch (_) { return Promise.resolve(null); }
        return Promise.resolve(ready).then(() => {
          // 一帧静音缓冲可解锁部分 iOS / 内嵌浏览器的 Web Audio 输出。
          if (!audioPrimed) {
            const source = ctx.createBufferSource();
            source.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
            source.connect(audioMaster || ctx.destination);
            source.onended = () => source.disconnect();
            source.start(0);
            audioPrimed = true;
          }
          return ctx;
        }).catch(() => null);
      }

      function stopAllTones() {
        audioToken++; // 同时取消尚在等待 resume() 的音效。
        activeTones.forEach(({ osc, gain }) => {
          try { osc.stop(); } catch (_) {}
          osc.disconnect(); gain.disconnect();
        });
        activeTones.clear();
      }

      function scheduleTone(ctx, freq, duration, type, volume, delay) {
        if (!state.sound || !ctx || ctx.state !== 'running') return;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        const start = ctx.currentTime + Math.max(.008, delay);
        const peak = Math.min(.45, volume * SFX_VOLUME_SCALE);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        osc.frequency.exponentialRampToValueAtTime(Math.max(80, freq * .94), start + duration);
        gain.gain.setValueAtTime(.0001, start);
        gain.gain.exponentialRampToValueAtTime(peak, start + .012);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
        osc.connect(gain).connect(audioMaster || ctx.destination);
        const tone = { osc, gain };
        activeTones.add(tone);
        osc.onended = () => {
          osc.disconnect(); gain.disconnect(); activeTones.delete(tone);
        };
        osc.start(start); osc.stop(start + duration + .025);
      }

      function playTone(freq, duration = .1, type = 'sine', volume = .07, delay = 0) {
        if (!state.sound) return;
        const ctx = ensureAudio(); if (!ctx) return;
        if (ctx.state !== 'running') {
          const token = audioToken;
          unlockAudio().then(ready => {
            if (token === audioToken) scheduleTone(ready, freq, duration, type, volume, delay);
          });
        } else {
          scheduleTone(ctx, freq, duration, type, volume, delay);
        }
      }

      function playChainPop(index, total) {
        // 在同一组内把音高平滑映射到更高音区；无论组有多大，每一步都会严格升高。
        const progress = total > 1 ? index / (total - 1) : 0;
        const startPitch = 300;
        const endPitch = Math.min(1180, startPitch + total * 48);
        const pitch = startPitch * Math.pow(endPitch / startPitch, progress);
        playTone(pitch, .105, 'sine', .072);
        playTone(pitch * 1.52, .065, 'triangle', .027, .008);
      }

      function playFinish(success) {
        if (!state.sound) return;
        const notes = success ? [523,659,784,1046] : [392,349,294];
        notes.forEach((n,i) => playTone(n, .18, 'sine', .075, i * .12));
      }
      // 所有计时器和常量初始化后再启动，恢复残局时可能直接打开结算弹窗。
      initAppearance();
      bindEvents();
      restoreOrCreateGame();
    })();
  </script>
